<html lang="en-GB">
<head>
<meta charset="utf-8">

<style>
:root{
 --acc:#5B3A7A;--acc2:#7C55A0;--bg1:#F8F3EC;--bg2:#ECE4F3;--tx:#1F1B24;--mut:#6B6474;--card:#FFFFFF;--line:#E3DCEA;
 --big:#1F5C99;--bigbg:#DCE9F7;--small:#8A5A00;--smallbg:#FBEBC8;--shadow:0 1px 2px rgba(60,30,90,.08),0 6px 18px rgba(60,30,90,.07);

 --head:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --acc:#C9A7E8;--acc2:#B48BDB;--bg1:#17141C;--bg2:#1E1826;--tx:#F0ECF4;--mut:#A79FB2;--card:#252030;--line:#3A3346;
 --big:#8DBBEB;--bigbg:#1E3248;--small:#E8B75A;--smallbg:#3D3118;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
 --colbg:rgba(255,255,255,.04);--onacc:#17141C;--lau:#D79BE6;--josh:#9CC0D6;--both:#E3B36A}}:root[data-theme=dark]{
 --acc:#C9A7E8;--acc2:#B48BDB;--bg1:#17141C;--bg2:#1E1826;--tx:#F0ECF4;--mut:#A79FB2;--card:#252030;--line:#3A3346;
 --big:#8DBBEB;--bigbg:#1E3248;--small:#E8B75A;--smallbg:#3D3118;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
 --colbg:rgba(255,255,255,.04);--onacc:#17141C;--lau:#D79BE6;--josh:#9CC0D6;--both:#E3B36A}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed}
body{margin:0;color:var(--tx);font:16px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;padding:0 16px 48px;max-width:1500px;margin:0 auto;overflow-x:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{min-height:44px;padding:8px 16px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
button:hover{box-shadow:var(--shadow)}button:active{transform:scale(.98)}
button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.homeb{font-weight:700;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--acc);color:var(--acc);background:var(--card);margin-right:10px;flex:none}
.trow{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;padding:10px;margin:6px 0;box-shadow:var(--shadow);color:var(--tx)}
.trow .tb2{flex:1;min-width:0}.trow .tt2{font-weight:600}.trow .tm2{font-size:.8rem;color:var(--mut)}.trow.tdone{opacity:.7}
.trow .tbtn{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.paywrap{max-width:820px}
.gboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media (max-width:620px){.gboard{grid-template-columns:1fr}}
.gcol{background:var(--colbg);border:1.5px dashed var(--line);border-radius:16px;padding:10px;min-height:140px}
.gcol.over{border-color:var(--acc);border-style:solid}
.gcard{position:relative;display:flex;align-items:flex-start;gap:8px;background:var(--card);border-radius:12px;padding:8px;margin:6px 0;box-shadow:var(--shadow);cursor:grab;border-left:5px solid var(--ac)}
.gcard.over{outline:2px solid var(--acc)}.gcard.overtop{box-shadow:0 -4px 0 var(--acc),var(--shadow)}.gcard.fresh{outline:2px solid var(--acc2)}
.gcard .tn{font-weight:700;color:var(--mut);min-width:1.4em;text-align:right;font-size:.85rem;padding-top:2px}
.gcard .gtx{flex:1;min-width:0}.gcard .tt2{font-weight:600}.gcard .tm2{font-size:.8rem;color:var(--mut)}
.gcard .tarr{display:flex;flex-direction:column;gap:2px}.gcard .tarr button{min-height:26px;min-width:34px;padding:0;font-size:.7rem;line-height:1}.gcard .tarr button:disabled{opacity:.3}
.gcard .gside{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.gcard .gside .x{position:static}.gcard .gside .lnk{font-size:.75rem}
.tcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.tcols.one{grid-template-columns:minmax(0,640px)}
@media (max-width:720px){.tcols{grid-template-columns:1fr}}
.tcol{background:var(--colbg);border:1.5px solid var(--line);border-radius:16px;padding:12px;min-height:120px}
.tcol.over{border-color:var(--acc)}
.tcol>input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card);color:var(--tx)}
.tjob{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:8px 8px 8px 10px;margin:6px 0;box-shadow:var(--shadow);cursor:grab}
.tjob.over{outline:2px solid var(--acc)}.tjob.fresh{outline:2px solid var(--acc2)}
.tjob .tn{font-weight:700;color:var(--mut);min-width:1.4em;text-align:right;font-size:.85rem}
.tjob .tb2{flex:1;min-width:0;cursor:pointer}.tjob .tt2{font-weight:600}.tjob .tm2{font-size:.8rem;color:var(--mut)}
.tjob .tarr{display:flex;flex-direction:column;gap:2px}.tjob .tarr button{min-height:26px;min-width:34px;padding:0;font-size:.7rem;line-height:1}
.tjob .tarr button:disabled{opacity:.3}
.gsheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,20,40,.38)}
.gpanel{background:var(--card);color:var(--tx);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 18px 24px;box-shadow:0 -6px 30px rgba(40,20,60,.25)}
@media (min-width:700px){.gsheet{align-items:center}.gpanel{border-radius:18px}}
.gpanel h3{margin:0 0 4px;font-family:var(--head);font-size:1.2rem}
.gpanel .glab{font-size:.85rem;color:var(--mut);margin:14px 0 6px;font-weight:700}
.gpanel input[type=text],.gpanel textarea,.gpanel select,.gpanel input[type=date]{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx)}
.gpanel textarea{min-height:70px;resize:vertical}
.gseg{display:flex;flex-wrap:wrap;gap:6px}.gseg button{min-height:40px}
.gseg button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.gstep{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.gstep input[type=checkbox]{width:22px;height:22px;flex:none}.gstep .gt{flex:1;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
.gstep.done .gt{text-decoration:line-through;color:var(--mut)}
.gnote{font-size:.85rem;color:var(--mut);margin-top:4px}
.gpanel .gfoot{display:flex;justify-content:space-between;gap:8px;margin-top:18px}

button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 8px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--acc);display:grid;grid-template-columns:repeat(2,9px);grid-template-rows:repeat(3,9px);gap:5px;place-content:center;box-shadow:var(--shadow)}
.logo i{background:var(--onacc);border-radius:50%}
.brand h1{font:700 1.7rem/1.1 var(--head);margin:0;color:var(--acc)}
.brand div{color:var(--mut);font-size:.95rem}
.who{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who .lbl{color:var(--mut);font-size:.9rem}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:.9rem;color:#fff;flex:none}
.av.p0{background:var(--lau)}.av.p1{background:var(--josh)}.av.p2{background:var(--both)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .av{color:#17141C}}:root[data-theme=dark] .av{color:#17141C}
.pick{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px}
.tabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.tabs button{border-radius:999px;padding:8px 20px}
.status{font-size:.82rem;color:var(--mut);margin:0 0 8px;min-height:1.2em}
/* layout */
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}.wrap>div{min-width:0}
@media (min-width:1000px){.wrap{grid-template-columns:310px minmax(0,1fr);align-items:start}.wrap>div:first-child{position:sticky;top:12px}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.panel h2{font:700 1.25rem var(--head);margin:0 0 4px}
.sub{color:var(--mut);font-size:.92rem;margin:0 0 12px}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.area{min-height:62px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.82rem;border-radius:14px;background:var(--ac,#eee);border:2px solid transparent;color:#1F1B24}
.area .em{font-size:1.4rem;line-height:1}
.area.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .area{background:var(--acd,#333);color:#F0ECF4}}:root[data-theme=dark] .area{background:var(--acd,#333);color:#F0ECF4}
.prompt{border-radius:18px;padding:16px;background:var(--ac,#eee);color:#1F1B24;margin-bottom:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .prompt{background:var(--acd,#333);color:#F0ECF4}}:root[data-theme=dark] .prompt{background:var(--acd,#333);color:#F0ECF4}
.prompt small{opacity:.75;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;font-weight:700}
.prompt p{font:500 1.2rem/1.3 var(--head);margin:6px 0 10px}
.prompt button{min-height:38px;padding:4px 14px;background:rgba(255,255,255,.7);color:#1F1B24}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--card)}
.add input:focus{border-color:var(--acc)}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;min-height:40px;padding:4px 10px}
.seg .bigb.on{background:var(--big);border-color:var(--big);color:#fff}.seg .smallb.on{background:var(--small);border-color:var(--small);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg .bigb.on,:root:not([data-theme=light]) .seg .smallb.on{color:#17141C}}:root[data-theme=dark] .seg .bigb.on,:root[data-theme=dark] .seg .smallb.on{color:#17141C}
details.paste{margin-top:10px}details.paste summary{cursor:pointer;color:var(--acc);font-weight:700;min-height:32px}
textarea{width:100%;min-height:120px;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px}
@media (max-width:700px){.board{grid-auto-columns:86%}}
.col{scroll-snap-align:start;background:var(--colbg);border:1px solid var(--line);border-radius:20px;padding:12px;min-height:260px;transition:background .15s,border-color .15s}
.col.ideas{border-style:dashed}
.col.over{background:var(--bigbg);border-color:var(--acc)}
.ch{display:flex;align-items:center;gap:10px;margin:2px 4px 10px}
.ch h3{font:700 1.1rem var(--head);margin:0}
.ch .cnt{color:var(--mut);font-size:.82rem}
.ch .avx{font-size:1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--small);border-radius:14px;padding:10px 12px;margin:0 0 10px;box-shadow:var(--shadow);cursor:grab;position:relative}.card.fresh{animation:pop .25s}
.card.big{border-left-color:var(--big)}
.card.done{opacity:.6}.card.done .ctext{text-decoration:line-through}
.card.dragging{opacity:.4}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;top:6px;right:6px;min-height:30px;min-width:30px;padding:0;border:0;background:none;color:var(--mut);font-size:1.1rem;border-radius:50%}.x:hover{background:var(--bg2);box-shadow:none}.ctop{padding-right:26px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.chip{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--bg2);color:var(--mut)}
.pill{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;border:0;min-height:26px;cursor:pointer}
.pill.big{background:var(--bigbg);color:var(--big)}.pill.small{background:var(--smallbg);color:var(--small)}
.ctext{font-size:1.02rem;word-break:break-word;min-height:24px}
.ctext[contenteditable=true]{background:var(--bg2);border-radius:8px;padding:2px 6px}
.subs{margin:8px 0 2px;padding-left:2px}
.sr{display:flex;gap:8px;align-items:center;font-size:.95rem;padding:3px 0}
.sr input{width:20px;height:20px;flex:none}
.sr.done span{text-decoration:line-through;color:var(--mut)}
.sr button{min-height:28px;padding:0 8px;margin-left:auto;border:0;background:none;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--bg2);margin:6px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--big)}
.cf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.cf .mini{min-height:34px;padding:2px 10px;font-size:.85rem}.tk{width:22px;height:22px;margin:0 2px 0 0;flex:none;cursor:pointer}
.give{display:flex;gap:4px;align-items:center;margin-right:auto}
.give button{min-height:30px;min-width:30px;width:30px;height:30px;font-size:.82rem;padding:0;border-radius:50%;border:0;display:grid;place-items:center}
.give .gi{width:auto!important;border-radius:999px;padding:0 8px;font-size:.8rem;background:var(--bg2)}
.brk input{width:100%;min-height:40px;border:2px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--card);margin-top:6px}
.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:14px;font-size:.92rem}
.balance{margin:0 0 14px;padding:12px 16px}
.bal{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--bg2);margin:8px 0}
.bal i{display:block}.bal .b0{background:var(--lau)}.bal .b1{background:var(--josh)}.bal .b2{background:var(--both)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem}
.note{background:var(--bigbg);border-radius:14px;padding:12px 14px;margin:10px 0}
.code{font:700 1.8rem var(--head);letter-spacing:.12em;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.day{max-width:640px;margin:auto}.day h2{font:700 1.5rem var(--head)}
input[type=text]{min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.steps{list-style:none;display:flex;gap:8px;flex-wrap:wrap;padding:0;margin:0 0 16px;counter-reset:s}
.steps button{display:flex;align-items:center;gap:8px;border-radius:999px;padding:6px 16px 6px 6px}
.steps .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--bg2);font-weight:700}
.steps button.on .num{background:var(--onacc);color:var(--acc)}
.steps button.past{color:var(--mut)}
.welcome{background:linear-gradient(135deg,var(--card),var(--bigbg));border:1px solid var(--line);border-radius:24px;padding:22px 26px;margin:0 0 18px;box-shadow:var(--shadow)}
.welcome h2{font:700 1.6rem var(--head);margin:0 0 8px;color:var(--acc)}
.welcome p{max-width:70ch;margin:0 0 10px}
.bwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.bwrap>div{min-width:0}
@media (min-width:1000px){.bwrap{grid-template-columns:420px minmax(0,1fr);align-items:start}.stagecol{position:sticky;top:12px}}
.stage{border-radius:24px;padding:22px;background:var(--ac);color:#1F1B24;box-shadow:var(--shadow);margin-bottom:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .stage{background:var(--acd);color:#F0ECF4}}:root[data-theme=dark] .stage{background:var(--acd);color:#F0ECF4}
.stage small{text-transform:uppercase;letter-spacing:.07em;font-size:.74rem;font-weight:700;opacity:.75}
.stage .q{font:600 1.75rem/1.2 var(--head);margin:8px 0 12px}
.hints{margin:0 0 14px;padding-left:20px;font-size:1rem}.hints li{margin:3px 0}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.stage .srow button{background:rgba(255,255,255,.75);color:#1F1B24;border-color:transparent}
.stage .srow button.on{background:var(--acc);color:#fff}
.tmr{font-variant-numeric:tabular-nums}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.sl{font-size:.85rem;color:inherit;opacity:.8;margin-right:4px}
.chipb{min-height:34px;padding:2px 12px;border-radius:999px;font-size:.88rem;background:rgba(255,255,255,.6);border:1px dashed rgba(0,0,0,.25);color:#1F1B24}
.add.big input{font-size:1.15rem;min-height:56px}
.seg .sl{color:var(--mut);align-self:center}
.wallhead{display:flex;align-items:baseline;gap:12px;margin:0 0 6px}.wallhead h2{font:700 1.4rem var(--head);margin:0}
.grp{margin:0 0 18px}.grp h3{font:700 1.05rem var(--head);margin:0 0 8px}.grp .cnt{color:var(--mut);font:400 .85rem "Atkinson Hyperlegible",sans-serif}
.notes{display:flex;flex-wrap:wrap;gap:12px}
.note{position:relative;width:210px;min-height:120px;padding:10px 12px 8px;border-radius:4px 4px 16px 4px;background:var(--ac);color:#1F1B24;box-shadow:0 2px 3px rgba(40,20,60,.12),0 8px 18px rgba(40,20,60,.1);transform:rotate(var(--rot,0deg));cursor:grab;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.note:hover{transform:rotate(0) translateY(-2px)}
.note.big{border-top:5px solid var(--big);width:240px}
.note.small{border-top:5px solid var(--small)}
.note.over{outline:3px dashed var(--acc);outline-offset:3px;transform:scale(1.03)}
.note.dragging{opacity:.4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .note{background:var(--acd);color:#F0ECF4}}:root[data-theme=dark] .note{background:var(--acd);color:#F0ECF4}
.ntop{display:flex;gap:6px;align-items:center;padding-right:24px;margin-bottom:6px}
.ntag{font-size:.72rem;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.6);color:#1F1B24}
.note .ctext{font-size:1rem;flex:1}
.nsubs{font-size:.88rem;margin:6px 0;padding:6px 8px;background:rgba(255,255,255,.45);border-radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .nsubs{background:rgba(0,0,0,.2)}:root:not([data-theme=light]) .ntag{background:rgba(0,0,0,.25);color:#F0ECF4}}:root[data-theme=dark] .nsubs{background:rgba(0,0,0,.2)}:root[data-theme=dark] .ntag{background:rgba(0,0,0,.25);color:#F0ECF4}
.ns{display:flex;gap:6px;align-items:center}.ns span{flex:1}.ns button{min-height:26px;padding:0 6px;border:0;background:none;color:inherit;opacity:.7}
.nfoot{display:flex;justify-content:space-between;margin-top:6px}

.nnpile{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}

function allAreas(){return AREAS.concat((D.cats||[]).filter(function(c){return !c.gone;}).map(function(c){return {k:c.k,n:c.n,e:'📌',c:'#E5E0D6',d:'#3B372E',y:'What needs doing for '+c.n+' in {M}?',s:[],custom:true};}));}

 var tasks={},gone={};

 return {tasks:out,gone:g,day:day,cats:Object.keys(cats).sort().map(function(k){return cats[k];}),triage:Object.keys(tri).sort().map(function(k){return tri[k];})};
}

function sync(){
 if(!SERVER||!L.code||ui.syncing)return Promise.resolve();
 ui.syncing=true;
 function round(tries){
  return req('GET').then(function(r){return r.status===404?{v:0,doc:{tasks:[],gone:[],day:{},cats:[]}}:r.json();}).then(function(remote){
   var m=merge(D,remote.doc),dl=stable(m)!==stable(D);D=m;
   var dr=stable(m)!==stable(remote.doc);if(dl)persist();
   var p=Promise.resolve();
   if(dr){p=req('PUT',{base:remote.v,doc:m}).then(function(r){if(r.status===409&&tries>0)return round(tries-1);if(!r.ok&&r.status!==409)throw new Error('save');});}
   return p.then(function(){ui.status='Shared · up to date '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(dl)draw();else status();});
  });
 }

}

function b64key(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function pushSend(path,body){return fetch(SERVER+path+L.code,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'failed');return j;});});}
function pushOn(){
 ui.status='Turning on reminders…';status();
 Notification.requestPermission().then(function(p){
  if(p!=='granted')throw new Error('Notifications were not allowed.');
  return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});
 }).then(function(reg){
  return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64key(VAPID_PUBLIC)});});
 }).then(function(sub){return sync().then(function(){return pushSend('/sub/',{who:L.me,sub:sub.toJSON()});}).then(function(){L.push=sub.endpoint;persist();ui.status='Reminders are on.';draw(true);});})
 .catch(function(e){ui.status='Reminders could not be turned on: '+(e.message||e);draw(true);});
}
function pushOff(){
 var ep=L.push;L.push='';persist();
 navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription();}).then(function(s){if(s)s.unsubscribe();}).catch(function(){});
 if(ep&&L.code)pushSend('/unsub/',{endpoint:ep}).catch(function(){});
 ui.status='Reminders are off on this phone.';draw(true);
}
/* yearly repeats: when a repeating job is finished, next year's copy appears (the same rule as on My day) */
/* REPEATS (24 Nov 2026): `rep` is week, month, 3m, 6m, year or 2y. Finishing a repeating job with a due date makes the next one. */
var REPS=[['','Does not repeat'],['week','Every week'],['month','Every month'],['3m','Every 3 months'],['6m','Every 6 months'],['year','Every year'],['2y','Every 2 years']];
function nextDue(due,r){
 var p=due.split('-').map(Number),y=p[0],m=p[1]-1,d=p[2];
 if(r==='week'){var w=new Date(Date.UTC(y,m,d+7));return w.toISOString().slice(0,10);}
 var add={month:1,'3m':3,'6m':6,year:12,'2y':24}[r]||12;m+=add;y+=Math.floor(m/12);m=m%12;
 var last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return new Date(Date.UTC(y,m,Math.min(d,last))).toISOString().slice(0,10);
}
function rollRepeats(){
 D.tasks.slice().forEach(function(t){
  if(t.parent||!t.rep||!t.done||!t.due||t.rolled)return;
  D.tasks.push({id:id(),text:t.text,size:t.size||'small',area:t.area,tag:t.tag,to:t.to,by:t.by,n:Date.now(),done:false,due:nextDue(t.due,t.rep),rep:t.rep,lead:t.lead,notes:t.notes,dur:t.dur,dev:t.dev,updated:now()});
  t.rolled=true;t.updated=now();
 });
}
/* ---- THE DETAIL PANEL: tapping a job (or a step) on the wall or Share out opens Get a grip's set-up for it, so jobs can be
   set up together. Fields are stored exactly as Get a grip stores them (size, parent, dur, dev, notes, wait, wf, due, rep), so
   My day shows the same. Changes save as they are made. ---- */
var DURS=[['quick','15 minutes'],['30','30 minutes'],['60','1 hour'],['day','All day']];
var DEVS=[['none','None needed'],['phone','Phone'],['tablet','Tablet'],['laptop','Laptop or PC']];
function addDays(n,unit){var d=new Date();if(unit==='month')d.setMonth(d.getMonth()+n);else d.setDate(d.getDate()+(unit==='week'?7*n:n));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function nice(ds){var p=ds.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
function seg(act,opts,cur,idv){return '<div class="gseg">'+opts.map(function(o){return '<button class="'+(cur===o[0]?'on':'')+'" data-act="'+act+'" data-id="'+idv+'" data-v="'+o[0]+'">'+esc(o[1])+'</button>';}).join('')+'</div>';}
function panel(){
 var t=byId(ui.sheet);if(!t){ui.sheet=null;return '';}
 var par=t.parent?byId(t.parent):null,ks=kids(t.id),top=par||t;
 var h='<div class="gsheet" data-act="gclose"><div class="gpanel" role="dialog" aria-modal="true" aria-label="Set up this job">';
 h+='<h3>'+(par?'A step':'Set up this job')+'</h3>'+(par?'<div class="gnote">Part of “'+esc(par.text)+'”. <button class="lnk" data-act="gopen" data-id="'+par.id+'">Open the whole job</button></div>':'');
 h+='<div class="glab">What it is</div><input type="text" data-g="text" data-id="'+t.id+'" value="'+esc(t.text)+'">';
 var bigs=live().filter(function(x){return x.size==='big'&&!x.done&&x.id!==t.id&&x.id!==(par&&par.id);});
 if(par||(t.size!=='big'&&!ks.length)){
  h+='<div class="glab">Part of a big job</div><select data-g="partof" data-id="'+t.id+'"><option value="">None: a job on its own</option>'+(par?'<option value="'+par.id+'" selected>'+esc(par.text)+'</option>':'')+bigs.map(function(x){return '<option value="'+x.id+'">'+esc(x.text)+'</option>';}).join('')+'</select><div class="gnote">It becomes the last step of that job and takes its area.</div>';
 }else if(!par&&t.size!=='big'&&ks.length&&bigs.length){

 }
 if(!par){
  h+='<div class="glab">Size</div>'+seg('gsize',[['small','Small'],['big','Big']],t.size==='big'?'big':'small',t.id);
  h+='<div class="glab">Area (its activity in Getting a grip)</div><select data-g="area" data-id="'+t.id+'">'+allAreas().filter(function(x){return !x.gone;}).map(function(x){return '<option value="'+x.k+'"'+((t.area||'wild')===x.k?' selected':'')+'>'+x.e+' '+esc(x.n)+'</option>';}).join('')+'</select>';
  h+='<div class="glab">Whose job</div>'+seg('gwho',[['0',NAMES[0]],['1',NAMES[1]],['','Not decided yet']],t.to===0||t.to===1?String(t.to):'',t.id);

  h+='<input type="text" data-brk="'+t.id+'" placeholder="Add a step, then Enter" style="margin-top:8px">';
 }
 h+='<div class="glab">How long it takes</div>'+seg('gdur',DURS.concat([['','Not set']]),t.dur||'',t.id);
 h+='<div class="glab">Needs at least</div>'+seg('gdev',DEVS.concat([['','Not set']]),t.dev||'',t.id);
 h+='<div class="glab">Details</div><textarea data-g="notes" data-id="'+t.id+'" placeholder="A phone number, a web address, where things are…">'+esc(t.notes||'')+'</textarea>';
 var wl=t.wait&&t.wait>today()?'Waiting until '+nice(t.wait):t.wf&&byId(t.wf)?'Waiting until “'+byId(t.wf).text+'” is finished':'Not waiting';
 h+='<div class="glab">Wait</div><div class="gnote" style="margin:0 0 6px">'+esc(wl)+'</div>'+seg('gwait',[['day','A day'],['week','A week'],['month','A month'],['','Not waiting']],'',t.id);
 h+='<div style="display:flex;gap:8px;margin-top:6px"><input type="date" data-g="waitdate" data-id="'+t.id+'" aria-label="Wait until a date" value="'+(t.wait||'')+'"></div>';
 var others=live().filter(function(x){return x.id!==top.id&&!x.done;});
 if(others.length)h+='<select data-g="wf" data-id="'+t.id+'" aria-label="Wait until another job is finished" style="margin-top:6px"><option value="">…or wait until another job is finished</option>'+others.map(function(x){return '<option value="'+x.id+'"'+(t.wf===x.id?' selected':'')+'>'+esc(x.text)+'</option>';}).join('')+'</select>';
 if(!par){
  h+='<div class="glab">Due date (optional)</div><input type="date" data-g="due" data-id="'+t.id+'" value="'+(t.due||'')+'"><div class="gnote">A reminder comes to the phone a week before and the day before.</div>';
  if(t.due)h+='<div class="glab">Comes into the list</div><select data-g="lead" data-id="'+t.id+'"><option value="">Straight away</option>'+LEADS.map(function(o){return '<option value="'+o[0]+'"'+(t.lead===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select><div class="gnote">Until then it stays off the phone’s lists, then appears at the top.</div>';
  h+='<div class="glab">Repeats</div><select data-g="rep" data-id="'+t.id+'">'+REPS.map(function(r){return '<option value="'+r[0]+'"'+((t.rep||'')===r[0]?' selected':'')+'>'+r[1]+'</option>';}).join('')+'</select><div class="gnote">When it is ticked, the next one appears with its due date moved on.</div>';
 }
 h+='<div class="gfoot"><button data-act="del" data-id="'+t.id+'">Delete</button><button class="on" data-act="gclose">Done</button></div>';
 return h+'</div></div>';
}
function gset(t,k,v){if(v===''||v===null||v===undefined)delete t[k];else t[k]=v;touch(t);}
document.addEventListener('change',function(e){
 if(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-tlead')){var ti=(D.triage||[]).filter(function(x){return x.id===e.target.getAttribute('data-tlead');})[0];if(ti){ti.lead=+e.target.value;ti.u=now();changed();}return;}
 if(e.target&&e.target.id==='tfile'){var f=e.target.files&&e.target.files[0];if(f){var rd=new FileReader();rd.onload=function(){bringIn(rd.result);};rd.readAsText(f);}e.target.value='';return;}
 var el=e.target,k=el.getAttribute&&el.getAttribute('data-g');if(!k)return;var t=byId(el.getAttribute('data-id'));if(!t)return;
 if(k==='text'){var v=el.value.trim();if(v&&v!==t.text){t.text=v;touch(t);}}
 else if(k==='notes')gset(t,'notes',el.value.trim()?el.value:'');
 else if(k==='waitdate'){delete t.wf;delete t.wh;gset(t,'wait',el.value);}
 else if(k==='wf'){delete t.wait;delete t.wh;gset(t,'wf',el.value);}
 else if(k==='partof'){if(!el.value)unnest(t);else{var pj=byId(el.value);if(pj&&pj.id!==t.parent){if(t.parent)delete t.parent;nest(t,pj);}}}
 else if(k==='mergeinto'){var mj=byId(el.value);if(mj&&confirm('Move the '+kids(t.id).length+' steps of “'+t.text+'” into “'+mj.text+'”? “'+t.text+'” will then be removed.'))nest(t,mj);}
 else if(k==='area'){t.area=el.value||'wild';kids(t.id).forEach(function(x){x.area=t.area;x.updated=now();});touch(t);}
 else if(k==='due')gset(t,'due',el.value);
 else if(k==='rep')gset(t,'rep',el.value);
 else if(k==='lead')gset(t,'lead',el.value?+el.value:'');
 draw(true);
});
/* ---- 3 · TASKS: household jobs worked on Get a grip style. Views: Lauren and Josh (a column each), Lauren, Josh.
   Each person's column IS their priority order, top first (field `r`, shared; jobs without `r` are newest and sit on top).
   Drag up or down, or use the arrows, to reorder; drag into the other column to hand a job over. Tap a job for its set-up. ---- */
function hhOnly(){return !!(L.shared||L.together);}
function ranked(list){
 var un=list.filter(function(t){return t.r===undefined||t.r===null;}).sort(function(a,b){return (b.n||0)-(a.n||0);});
 var rk=list.filter(function(t){return !(t.r===undefined||t.r===null);}).sort(function(a,b){return a.r-b.r;});
 return un.concat(rk);
}
function colList(i){return ranked(live().filter(function(t){return t.to===i&&!t.done;}));}
function moveJob(t,i,beforeId){
 var list=colList(i).filter(function(x){return x!==t;}),at=beforeId?list.indexOf(byId(beforeId)):-1;
 if(at<0)at=list.length;list.splice(at,0,t);
 if(t.to!==i){t.to=i;kids(t.id).forEach(function(k){k.to=i;k.updated=now();});}
 list.forEach(function(x,k){if(x.r!==k*10){x.r=k*10;x.updated=now();}});
 t.updated=now();ui.fresh=t.id;changed();
}
var DURW={quick:'15 min','30':'30 min','60':'1 hour',day:'All day'};
function tjob(t,i,ix,n){
 var ks=kids(t.id),dn=ks.filter(function(k){return k.done;}).length,bits=[];
 if(ks.length)bits.push(dn+' of '+ks.length+' steps');
 if(t.dur&&DURW[t.dur])bits.push(DURW[t.dur]);
 var w=t.wait&&t.wait>today()?'Waiting':t.wf&&byId(t.wf)&&!byId(t.wf).done?'Waiting':'';if(w)bits.push(w);
 return '<div class="tjob'+(ui.fresh===t.id?' fresh':'')+'" draggable="true" data-id="'+t.id+'"><span class="tn">'+(ix+1)+'</span><span class="pill '+(t.size==='big'?'big':'small')+'">'+(t.size==='big'?'Big':'Small')+'</span>'
  +'<div class="tb2" data-act="edit" data-id="'+t.id+'"><div class="tt2">'+esc(t.text)+'</div>'+(bits.length?'<div class="tm2">'+esc(bits.join(' · '))+'</div>':'')+'</div>'
  +'<span class="tarr"><button data-act="up" data-id="'+t.id+'" aria-label="Higher priority"'+(ix===0?' disabled':'')+'>▲</button><button data-act="down" data-id="'+t.id+'" aria-label="Lower priority"'+(ix===n-1?' disabled':'')+'>▼</button></span></div>';
}
function tasksTab(){
 var v=L.tview||(hhOnly()?'both':String(L.me));
 var h='<div class="intro"><h2>Household tasks</h2><p class="sub">Each list is in priority order, most important at the top. Drag a job up or down, or use the arrows. Drag it across to hand it to the other person. Tap a job to set it up.</p></div>';
 h+='<div class="gseg" style="margin:0 0 12px">'+[['both',NAMES[0]+' and '+NAMES[1]],['0',NAMES[0]],['1',NAMES[1]]].map(function(x){return '<button class="'+(v===x[0]?'on':'')+'" data-act="tview" data-v="'+x[0]+'">'+esc(x[1])+'</button>';}).join('')+'</div>';
 var cols=v==='both'?[0,1]:[+v];
 h+='<div class="tcols'+(cols.length===1?' one':'')+'">';
 cols.forEach(function(i){
  var l=colList(i),big=l.filter(function(t){return t.size==='big';}).length,done=live().filter(function(t){return t.to===i&&t.done;}).length;
  h+='<section class="tcol" data-col="'+i+'"><div class="ch">'+av(i,34)+'<div><h3>'+esc(NAMES[i])+'</h3><div class="cnt">'+(l.length?big+' big · '+(l.length-big)+' small':'Nothing yet')+(done?' · '+done+' done':'')+'</div></div></div>';
  h+='<input type="text" data-addfor="'+i+'" placeholder="Add a job for '+esc(NAMES[i])+', then Enter">';

  l.forEach(function(t,ix){h+=tjob(t,i,ix,l.length);});
  h+='</section>';
 });
 var un=live().filter(function(t){return (t.to===null||t.to===undefined)&&!t.done;}).length;
 if(un)h+='<p class="sub">'+un+' job'+(un>1?'s are':' is')+' still to share out. <button class="lnk" data-act="tab" data-t="alloc">Go to Share out</button></p>';
 return h+'</div>';
}
/* ---- DEVICE PIN (owner, 22 Nov 2026). Personal tasks belong to the DEVICE (they are kept in this browser), so once the device's
   owner sets a PIN, it is asked for whenever personal things would come into view: leaving "Household view",
   or switching the device to the other person. Stored only on this device as a salted SHA-256 hash (L.pin, L.pinSalt, L.pinWho).
   A curtain against a casual tap, not strong security (the data is still in the browser). Forgotten PIN: "Reset" removes the PIN AND
   this device's personal tasks, so nothing private is exposed. ---- */
function pinHash(pin){var b=new TextEncoder().encode((L.pinSalt||'')+':'+pin);return crypto.subtle.digest('SHA-256',b).then(function(h){return Array.from(new Uint8Array(h)).map(function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}
function needPin(next){return !!L.pin&&(hhOnly()||(next.me!==undefined&&next.me!==L.me));}
function applyMove(n){
 if(n.me!==undefined){L.shared=false;L.together=false;var old=L.me;L.me=n.me;if(old!==L.me&&L.push&&L.code)navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription();}).then(function(sub){if(sub)pushSend('/sub/',{who:L.me,sub:sub.toJSON()});}).catch(function(){});}
 if(n.together!==undefined){L.together=n.together;if(!n.together)L.shared=false;}
 if(n.shared){L.shared=true;L.together=false;L.tview='both';}
 if(hhOnly()&&L.tab==='day')L.tab='alloc';
 persist();
}
function askMove(n){if(needPin(n)){ui.pin={mode:'enter',then:n,err:''};}else applyMove(n);}
function pinPanel(){
 var P=ui.pin,who=NAMES[L.pinWho===1?1:0];
 var h='<div class="gsheet"><div class="gpanel" role="dialog" aria-modal="true" aria-label="PIN" style="max-width:420px">';
 if(P.mode==='set'){
  h+='<h3>Set a PIN for this device</h3><p class="gnote">It belongs to '+esc(NAMES[L.me])+', whose personal tasks are kept on this device. It will be asked for before anything personal shows again after “Household view”, or before switching to the other person. Four to eight numbers.</p>';
  h+='<input type="password" inputmode="numeric" autocomplete="off" id="pin1" placeholder="New PIN" maxlength="8"><input type="password" inputmode="numeric" autocomplete="off" id="pin2" placeholder="The same PIN again" maxlength="8" style="margin-top:8px">';
 }else{
  h+='<h3>'+esc(who)+'’s PIN</h3><p class="gnote">This device holds '+esc(who)+'’s personal tasks. Enter the PIN to carry on.</p><input type="password" inputmode="numeric" autocomplete="off" id="pin1" placeholder="PIN" maxlength="8">';
 }
 if(P.err)h+='<p class="gnote" style="color:var(--small);font-weight:700">'+esc(P.err)+'</p>';
 h+='<div class="gfoot"><button data-act="pincancel">Cancel</button><button class="on" data-act="pinok">'+(P.mode==='set'?'Set PIN':'OK')+'</button></div>';
 if(P.mode==='enter')h+='<p class="gnote" style="margin-top:14px">Forgotten it? <button class="lnk" data-act="pinreset">Reset this device</button>: this removes the PIN and the personal tasks kept on this device, so nothing private can be seen.</p>';
 return h+'</div></div>';
}
function pinOk(){
 var P=ui.pin,a=(document.getElementById('pin1')||{}).value||'',b=(document.getElementById('pin2')||{}).value||'';
 if(P.mode==='set'){
  if(!/^\d{4,8}$/.test(a)){P.err='Use four to eight numbers.';draw(true);return;}
  if(a!==b){P.err='The two PINs are not the same.';draw(true);return;}
  var r=new Uint8Array(8);crypto.getRandomValues(r);L.pinSalt=Array.from(r).join('.');L.pinWho=L.me;
  pinHash(a).then(function(hh){L.pin=hh;var n=P.then;ui.pin=null;if(n)applyMove(n);persist();ui.status='PIN set for this device.';draw(true);});
  return;
 }
 if(Date.now()<(ui.pinWait||0)){P.err='Too many tries. Wait a moment, then try again.';draw(true);return;}
 pinHash(a).then(function(hh){
  if(hh===L.pin){ui.pinBad=0;var n=P.then;ui.pin=null;if(ui.pinNext==='set'){ui.pinNext=null;ui.pin={mode:'set',then:null,err:''};draw(true);return;}if(n==='remove'){L.pin='';L.pinSalt='';persist();ui.status='PIN removed.';}else applyMove(n);draw(true);}
  else{ui.pinBad=(ui.pinBad||0)+1;if(ui.pinBad>=5){ui.pinWait=Date.now()+30000;ui.pinBad=0;}P.err='That PIN is not right.';draw(true);}
 });
}
function pinReset(){
 if(!confirm('Reset this device? The PIN and ALL the personal tasks kept on this device will be removed. Household jobs are not affected.'))return;
 var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('gagh.')===0)ks.push(k);}
 ks.forEach(function(k){localStorage.removeItem(k);});
 L.pin='';L.pinSalt='';var n=ui.pin&&ui.pin.then;ui.pin=null;if(n&&n!=='remove')applyMove(n);persist();ui.status='This device was reset: no PIN, no personal tasks.';draw(true);
}
function pinRow(){
 if(L.shared)return '';

 else if(p.done&&p.ad){p.done=false;delete p.ad;p.updated=now();}
}

/* ---- events ---- */
document.addEventListener('change',function(e){var el=e.target,t=byId(el.getAttribute('data-id'));if(el.getAttribute('data-act')==='tick'&&t){t.done=el.checked?now():false;autoFinish(t);rollRepeats();touch(t);draw();}});
document.addEventListener('keydown',function(e){
 if(e.key!=='Enter')return;var el=e.target;
 if(el.id==='pin1'||el.id==='pin2'){e.preventDefault();if(el.id==='pin1'&&document.getElementById('pin2')){document.getElementById('pin2').focus();return;}pinOk();return;}
 if(el.hasAttribute&&el.hasAttribute('data-addfor')){e.preventDefault();var tx=el.value.trim().replace(/^[\s\-\*•]+/,''),wi=+el.getAttribute('data-addfor');if(tx){D.tasks.push({id:id(),text:tx,size:'small',area:'wild',tag:'',to:wi,by:L.me,done:false,n:Date.now(),updated:now()});changed();}el.value='';draw(true);var nb2=document.querySelector('[data-addfor="'+wi+'"]');if(nb2)nb2.focus();return;}
 if(el.id==='qa'){e.preventDefault();addIdea(el.value);el.value='';changed();draw(true);var q=document.getElementById('qa');if(q)q.focus();}
 else if(el.hasAttribute('data-brk')){e.preventDefault();var p=el.getAttribute('data-brk'),tx=el.value.trim(),par=byId(p);if(tx&&par){D.tasks.push({id:id(),text:tx,size:'small',area:par.area,to:par.to,parent:p,by:L.me,done:false,n:Date.now(),updated:now()});par.updated=now();changed();draw(true);var nb=document.querySelector('[data-brk="'+p+'"]');if(nb)nb.focus();}}
 else if(el.isContentEditable){e.preventDefault();el.blur();}
});
document.addEventListener('focusout',function(e){
 var el=e.target;
 if(el.isContentEditable){var t=byId(el.getAttribute('data-id')),v=el.textContent.trim();el.contentEditable='false';if(t&&v&&v!==t.text){t.text=v;touch(t);}draw(true);}
 else if(ui.defer)setTimeout(function(){if(!typing())draw(true);},50);
});
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;var act=b.getAttribute('data-act'),t=byId(b.getAttribute('data-id'));
 if(act==='edit'||act==='gopen'){ui.sheet=b.getAttribute('data-id');draw(true);return;}
 if(act==='gclose'){if(e.target!==b&&b.classList.contains('gsheet'))return;ui.sheet=null;draw(true);return;}
 if(act==='together'){if(L.together)askMove({together:false});else if(!L.pin){ui.pin={mode:'set',then:{together:true},err:''};}else applyMove({together:true});}
 else if(act==='me'&&b.getAttribute('data-i')==='2'){applyMove({shared:true});}
 else if(act==='me'){var wi2=+b.getAttribute('data-i');if(!(wi2===L.me&&!hhOnly()))askMove({me:wi2});}
 else if(act==='home'){if(opensOnMyDay()){persist();location.href='tasks.html';return;}toStart();ui.sheet=null;ui.pin=null;scrollTo(0,0);}
 else if(act==='more'){ui.more=true;ui.updMsg='';}
 else if(act==='mclose'){if(e.target!==b&&b.classList.contains('gsheet'))return;ui.more=false;}
 else if(act==='mtheme'){try{localStorage.setItem('gagh.gag.theme',b.getAttribute('data-v'));}catch(x){}applyTheme();}
 else if(act==='mgo'){ui.more=false;L.tab=b.getAttribute('data-t');}
 else if(act==='mreload'){location.reload();return;}
 else if(act==='mcheck'){if(!swReg){location.reload();return;}ui.updMsg='Checking…';draw(true);var fin=function(){setTimeout(function(){ui.updMsg=ui.updateReady?'A new version is ready: tap Update now at the top.':'You have the newest version ('+APP_VERSION+').';draw(true);},2500);};try{swReg.update().then(fin,fin);}catch(x){fin();}return;}
 else if(act==='mbackup'){var blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),an=document.createElement('a');an.href=u;an.download='household-backup-'+today()+'.json';document.body.appendChild(an);an.click();setTimeout(function(){URL.revokeObjectURL(u);an.remove();},500);return;}
 else if(act==='kindset'){L.kind=b.getAttribute('data-v');}
 else if(act==='kindfirst'){L.kind=b.getAttribute('data-v');persist();if(opensOnMyDay()){location.href='tasks.html';return;}}
 else if(act==='pinok'){pinOk();return;}
 else if(act==='pincancel'){ui.pin=null;}
 else if(act==='pinreset'){pinReset();return;}
 else if(act==='pinset'||act==='pinchange'){if(act==='pinchange'&&L.pin){ui.pin={mode:'enter',then:null,err:''};ui.pinNext='set';}else ui.pin={mode:'set',then:null,err:''};}
 else if(act==='pinremove'){ui.pin={mode:'enter',then:'remove',err:''};}
 else if(act==='tab'){if(b.getAttribute('data-t')==='day'){persist();location.href='tasks.html';return;}L.tab=b.getAttribute('data-t');scrollTo(0,0);}
 else if(act==='stage'){L.stage=b.getAttribute('data-k');if(L.stage==='areas')L.walkOpen=false;}
 else if(act==='begin'){L.welcomed=true;L.stage='warm';}
 else if(act==='previ'){var pk=b.getAttribute('data-k'),pn=pk==='warm'?WARM.length:12;L.idx[pk]=Math.max(0,(idx(pk)%pn)-1);}
 else if(act==='seti'){L.idx[b.getAttribute('data-k')]=+b.getAttribute('data-i');}
 else if(act==='prevpart'){var pa=area(L.area)||AREAS[0],pn2=pa.parts?pa.parts.length:12,pc=(L.part[pa.k]||0)%pn2;if(pc>0)L.part[pa.k]=pc-1;else{var tl=tilesList(),pv=tl[(tl.indexOf(pa)-1+tl.length)%tl.length];L.area=pv.k;L.part[pv.k]=(pv.parts?pv.parts.length:12)-1;}}
 else if(act==='nexti'){var k=b.getAttribute('data-k');L.idx[k]=idx(k)+1;}
 else if(act==='nextpart'){var ca=area(L.area)||AREAS[0],cn=ca.parts?ca.parts.length:12,cp=(L.part[ca.k]||0)%cn;if(cp<cn-1)L.part[ca.k]=cp+1;else{L.part[ca.k]=0;L.area=nextArea(ca).k;L.part[L.area]=0;}}
 else if(act==='addcat'){var nm=prompt('Name the new area, for example “Allotment” or “Grandparents”');if(nm&&nm.trim()){var ck='c'+id();D.cats.push({k:ck,n:nm.trim().slice(0,40),u:now()});L.walkOpen=true;L.area=ck;L.part[ck]=0;L.stage='areas';changed();}}
 else if(act==='delcat'){var dk=b.getAttribute('data-k');if(confirm('Remove this area? Its notes stay on the wall.')){D.cats.forEach(function(c){if(c.k===dk){c.gone=true;c.u=now();}});D.tasks.forEach(function(t){if(t.area===dk){t.area='wild';t.updated=now();}});L.area='house';changed();}}
 else if(act==='part'){L.part[L.area]=+b.getAttribute('data-i');}
 else if(act==='allareas'){L.walkOpen=false;}
 else if(act==='area'){L.walkOpen=true;L.area=b.getAttribute('data-k');L.part[L.area]=0;L.stage='areas';L.welcomed=true;}
 else if(act==='timer'){ui.timer=ui.timer>Date.now()?0:Date.now()+120000;}
 else if(act==='starter'){addIdea(b.getAttribute('data-v'));changed();}
 else if(act==='dsize'){ui.dsize=b.getAttribute('data-v');}
 else if(act==='qadd'){var q=document.getElementById('qa');addIdea(q.value);q.value='';changed();}
 else if(act==='example'){example();}
 else if(act==='clearex'){removeAll(exList());}
 else if(act==='clearall'){if(confirm('Clear every note from the wall and from Share out, for both of you? This cannot be undone.'))removeAll(D.tasks.slice());}
 else if(act==='give'&&t){var v=b.getAttribute('data-i');setOwner(t,v===''?null:+v);}
 else if(act==='gsize'&&t){t.size=b.getAttribute('data-v');touch(t);}
 else if(act==='gwho'&&t){var gv=b.getAttribute('data-v');setOwner(t,gv===''?null:+gv);ui.fresh=null;}
 else if(act==='gdur'&&t){gset(t,'dur',b.getAttribute('data-v'));}
 else if(act==='gdev'&&t){gset(t,'dev',b.getAttribute('data-v'));}
 else if(act==='gwait'&&t){var wv=b.getAttribute('data-v');delete t.wf;delete t.wh;gset(t,'wait',wv?addDays(1,wv):'');}
 else if(act==='size'&&t){t.size=t.size==='big'?'small':'big';touch(t);}
 else if(act==='nn'&&t){t.nn=true;touch(t);}
 else if(act==='unnn'&&t){delete t.nn;touch(t);}
 else if(act==='unlink'&&t){delete t.parent;t.n=Date.now();touch(t);}
 else if(act==='brk'&&t){ui.open[t.id]=!ui.open[t.id];draw(true);var nb=document.querySelector('[data-brk="'+t.id+'"]');if(nb)nb.focus();return;}
 else if(act==='del'&&t){if(!confirm('Delete “'+t.text+'”'+(kids(t.id).length?' and its steps':'')+'?'))return;if(ui.sheet===t.id)ui.sheet=t.parent||null;var rm=[t].concat(kids(t.id));rm.forEach(function(x){D.gone.push({id:x.id,at:now()});});D.tasks=D.tasks.filter(function(x){return rm.indexOf(x)<0;});changed();}
 else if(act==='plan'||act==='replan'){D.day[today()+':'+L.me]=pickDay(L.me);changed();}
 else if(act==='more'){var d=D.day[today()+':'+L.me],used=d.big.concat(d.small),nx=live().filter(function(x){return !x.done&&x.to===L.me&&used.indexOf(x.id)<0;})[0];if(nx){(nx.size==='big'?d.big:d.small).push(nx.id);d.u=now();changed();}else alert('Nothing more belongs to '+NAMES[L.me]+'.');}
 else if(act==='start'){L.code=newCode();ui.status='Starting…';persist();sync();}
 else if(act==='join'){var c=(document.getElementById('jc').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==12){alert('That code should have 12 letters and numbers.');return;}L.code=c;ui.status='Joining…';persist();sync();}
 else if(act==='locally'){L.local=true;L.tab='brain';}
 else if(act==='syncnow'){sync();}
 else if((act==='gup'||act==='gdown')&&t){var gl=gList(t.size==='big'?'big':'small'),gi=gl.indexOf(t);if(act==='gup'&&gi>0)gmove(t,t.size==='big'?'big':'small',gl[gi-1].id);else if(act==='gdown'&&gi<gl.length-1)gmove(t,t.size==='big'?'big':'small',gl[gi+2]?gl[gi+2].id:null);}
 else if(act==='tcopy'){var pr=aiPrompt();(navigator.clipboard?navigator.clipboard.writeText(pr):Promise.reject()).then(function(){ui.status='Prompt copied. Paste it into the AI.';status();},function(){var ta=document.getElementById('tprompt');if(ta){ta.closest('details').open=true;ta.select();}ui.status='Select the prompt below and copy it.';status();});return;}
 else if(act==='tread'){bringIn((document.getElementById('tpaste')||{}).value||'');return;}
 else if(act==='taddall'||act==='tadd'||act==='tskip'||act==='tback'||act==='tsize'){var all=(D.triage||[]),one=all.filter(function(x){return x.id===b.getAttribute('data-tid');})[0];
  if(act==='taddall'){var nn=0;all.forEach(function(x){if(x.st==='new'){triAdd(x);nn++;}});ui.status='Added '+nn+' jobs. Those with an owner are already in their column on Share out.';}
  else if(one&&act==='tadd'){triAdd(one);ui.status='Added “'+one.what+'”'+(one.who===0||one.who===1?' for '+NAMES[one.who]:' to Still to share out')+'.';}
  else if(one&&act==='tskip'){one.st='skipped';one.u=now();changed();}
  else if(one&&act==='tback'){one.st='new';one.u=now();changed();}
  else if(one&&act==='tsize'){one.size=b.getAttribute('data-v');one.u=now();changed();}}
 else if(act==='twho'||act==='twhoall'){var wv=b.getAttribute('data-v'),w=wv===''?'':+wv;(D.triage||[]).forEach(function(x){if(x.st==='new'&&(act==='twhoall'||x.id===b.getAttribute('data-tid'))){x.who=w;x.u=now();}});changed();}
 else if(act==='tundo'){var it=(D.triage||[]).filter(function(x){return x.id===b.getAttribute('data-tid');})[0];if(it){var jb=it.job&&byId(it.job);if(!confirm('Take “'+it.what+'” out? '+(jb?'Its job “'+jb.text+'” is removed from the wall, and a':'A')+' newer file can bring it in again.'))return;if(jb){D.gone.push({id:jb.id,at:now()});D.tasks=D.tasks.filter(function(x){return x!==jb;});}it.st='skipped';it.u=now();changed();}}
 else if(act==='tview'){L.tview=b.getAttribute('data-v');}
 else if((act==='up'||act==='down')&&t){var cl=colList(t.to),ix=cl.indexOf(t),nb=act==='up'?cl[ix-1]:cl[ix+2];if(act==='up'&&ix>0)moveJob(t,t.to,nb.id);else if(act==='down'&&ix<cl.length-1)moveJob(t,t.to,nb?nb.id:null);}
 else if(act==='pushon'){pushOn();return;}
 else if(act==='pushoff'){pushOff();return;}
 else if(act==='pushtest'){ui.status='Sending a test reminder…';status();pushSend('/test/',{endpoint:L.push}).then(function(j){ui.status=j.ok?'Test sent. It should appear in a few seconds.':'The test could not be sent ('+j.status+').';status();}).catch(function(e){ui.status='The test could not be sent: '+e.message;status();});return;}
 else if(act==='leave'){if(confirm('Stop sharing on this device? Your copy stays here.')){if(L.push)pushOff();L.code='';}}
 persist();draw(true);
 if(act==='area'||act==='nextpart'||act==='prevpart'){var st=document.querySelector('.stage');if(st&&st.getBoundingClientRect().top<0)st.scrollIntoView({block:'start',behavior:'smooth'});}
});
/* drag and drop: onto a note = make it a step; onto a column = give it to that person */
document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('[draggable][data-id]');if(!c)return;e.dataTransfer.setData('text/plain',c.getAttribute('data-id'));e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
function clearOver(){document.querySelectorAll('.over,.overtop').forEach(function(x){x.classList.remove('over');x.classList.remove('overtop');});}
document.addEventListener('dragend',function(e){var c=e.target.closest&&e.target.closest('[data-id]');if(c)c.classList.remove('dragging');clearOver();});
function target(e){return (e.target.closest&&(e.target.closest('.gcard[data-id]')||e.target.closest('.gcol')||e.target.closest('.tjob[data-id]')||e.target.closest('.tcol')||e.target.closest('.note[data-id]')||e.target.closest('.col')));}
document.addEventListener('dragover',function(e){var c=target(e);if(!c)return;e.preventDefault();var cls='over';if(c.classList.contains('gcard')){var rc=c.getBoundingClientRect();cls=(e.clientY-rc.top)<rc.height*0.3?'overtop':'over';}if(!c.classList.contains(cls)){clearOver();c.classList.add(cls);}});
document.addEventListener('drop',function(e){var c=target(e);if(!c)return;e.preventDefault();clearOver();var t=byId(e.dataTransfer.getData('text/plain'));if(!t)return;
 if(c.classList.contains('gcard')){var gt=byId(c.getAttribute('data-id')),rc2=c.getBoundingClientRect();if(gt&&gt!==t){if((e.clientY-rc2.top)<rc2.height*0.3)gmove(t,gt.size==='big'?'big':'small',gt.id);else nest(t,gt);}}
 else if(c.classList.contains('gcol')){gmove(t,c.getAttribute('data-size'),null);}
 else if(c.classList.contains('tjob')){var bt=byId(c.getAttribute('data-id'));if(bt&&bt!==t&&!t.parent)moveJob(t,bt.to,bt.id);}
 else if(c.classList.contains('tcol')){if(!t.parent)moveJob(t,+c.getAttribute('data-col'),null);}
 else if(c.classList.contains('note')){nest(t,byId(c.getAttribute('data-id')));}
 else{var v=c.getAttribute('data-to');setOwner(t,v===''?null:+v);}
 draw(true);});
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync();});
setInterval(function(){if(!document.hidden)sync();},20000);
draw(true);sync();
if('serviceWorker' in navigator){
 var hadCtl=!!navigator.serviceWorker.controller;
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtl){ui.updateReady=true;draw(true);}});
 navigator.serviceWorker.register('sw.js').then(function(r){swReg=r;checkUpdate();}).catch(function(){});
 document.addEventListener('visibilitychange',function(){if(!document.hidden)checkUpdate();});
 setInterval(checkUpdate,20*60*1000);
}
